---
- name: Install caddy web server
  become: true
  ansible.builtin.apt:
    name:
      - caddy
    state: present
    update_cache: true

- name: enable caddy service
  become: true
  ansible.builtin.service:
    name: caddy
    state: started
    enabled: true

- name: replace default web page
  become: true
  ansible.builtin.copy:
    content: |
      <html>
      <head>
      <title>My awesome web page</title>
      </head>
      <body>
      foo and bar...
      </body>
      </html>
    dest: /usr/share/caddy/index.html

- name: restart caddy service
  become: true
  ansible.builtin.service:
    name: caddy
    state: restarted

